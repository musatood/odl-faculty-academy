<title>نافذة المدير — سير الدورة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d2a26;--mu:#5d6b66;--pr:#0f6b4f;--pr2:#e3f1ea;--ac:#c28a1e;--bd:#dcd8cc;--ok:#1b7f45;--no:#b3261e;--track:#e3e7ee;--warn:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--card:#1b2420;--tx:#e8efec;--mu:#9bb0a8;--pr:#4cc79a;--pr2:#1f332b;--ac:#e0b04a;--bd:#2d3a35;--ok:#58d68d;--no:#ff8a80;--track:#2d3a35;--warn:#3a3317}}
:root[data-theme="dark"]{--bg:#121917;--card:#1b2420;--tx:#e8efec;--mu:#9bb0a8;--pr:#4cc79a;--pr2:#1f332b;--ac:#e0b04a;--bd:#2d3a35;--ok:#58d68d;--no:#ff8a80;--track:#2d3a35;--warn:#3a3317}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,Arial,sans-serif;line-height:1.8;font-size:17px}
header{background:linear-gradient(135deg,#0f6b4f,#0a3d2e);color:#fff;padding:20px 16px}
.brand{display:flex;align-items:center;gap:14px;max-width:1000px;margin:auto}
.brand img{width:72px;height:72px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.3);flex:none}
.brand h1{margin:0 0 2px;font-size:1.3rem}
.brand p{margin:0;opacity:.85;font-size:.9rem}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h2{margin:0 0 6px;color:var(--pr);font-size:1.25rem}
h3{margin:1.4em 0 .5em;color:var(--ac);font-size:1.05rem}
.note{font-size:.85rem;color:var(--mu);margin:.3em 0 1em}
label{font-weight:700;display:block}
input[type=password]{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:6px 0 10px;direction:ltr;text-align:left}
button.b{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 18px;font:inherit;cursor:pointer;margin:3px}
button.b.s{background:var(--pr2);color:var(--pr)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#lock{max-width:440px;margin:6vh auto}
#err{font-weight:700;margin-top:6px;color:var(--no);min-height:1.4em}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.kpis{display:flex;flex-wrap:wrap;gap:10px}
.kpi{flex:1 1 150px;padding:14px 10px;border-radius:12px;background:var(--pr2);text-align:center}
.kpi.hot{background:var(--warn)}
.kpi b{display:block;font-size:1.9rem;line-height:1.3}
.row{margin:10px 0}
.row .top{display:flex;justify-content:space-between;gap:8px}
.track{background:var(--track);border-radius:8px;height:12px;overflow:hidden}
.fill{height:12px;border-radius:8px;background:var(--pr);transition:width .5s ease}
.dist{display:flex;align-items:center;gap:8px;margin:6px 0}
.dist span{width:74px;flex:none}
.dist .track{flex:1}
.dist .fill{background:var(--ac)}
.dist b{width:30px;text-align:center}
.small{background:var(--warn);border-radius:10px;padding:10px 14px}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
@media (max-width:600px){.brand img{width:56px;height:56px}.brand h1{font-size:1.05rem}.kpi b{font-size:1.6rem}}
</style>
</head>

<div><h1>نافذة مدير المركز</h1><p>متابعة سير الدورة — عرض فقط</p></div>
</div>
</header>
<main>
<div class="card" id="lock">
<h2>دخول المدير</h2>
<p class="note">أرقام مجمّعة عن سير المتدربين، بلا أسماء ولا أرقام هواتف ولا درجات.</p>
<label for="mpin">رمز المدير</label>
<input type="password" id="mpin" autocomplete="off" placeholder="اكتب الرمز">
<button class="b" id="go">دخول</button>
<div id="err" role="alert"></div>
</div>
<div class="card" id="body" style="display:none"></div>
</main>
<script>
const SHEET_URL='https://script.google.com/macros/s/AKfycbzqdZNXikxVOPWmDPZrSf7cLxolW0v0x4QtcYeYA7MWjIjZO73xPwpH51v4kv4bvvOXog/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let MP='',timer=null;   /* الرمز في الذاكرة فقط: يُمسح بالخروج أو بإغلاق الصفحة */

function lockUI(msg){
  MP='';clearInterval(timer);timer=null;
  $('body').style.display='none';$('lock').style.display='block';
  $('err').textContent=msg||'';
}
function errText(j){
  if(j.err==='not_set')return 'لم يُضبط رمز المدير بعد (MGR_PIN) في إعداد الخادم.';
  if(j.err==='locked')return '🔒 مقفل مؤقتاً بعد محاولات خاطئة. حاول بعد '+(j.wait||15)+' دقيقة.';
  if(j.err==='pin')return 'الرمز غير صحيح'+(j.left!=null?' (المتبقي '+j.left+' محاولات)':'');
  if(j.err==='post_only')return 'الخادم يعمل بنسخة قديمة: انشر Code.gs وTracking.gs بإصدار جديد.';
  return 'تعذّر التحميل ('+esc(j.err||'')+')';
}
const kpi=(n,t,hot)=>'<div class="kpi'+(hot&&n>0?' hot':'')+'"><b>'+esc(n)+'</b>'+esc(t)+'</div>';

async function load(first){
  if(first!==false&&$('mpin').value)MP=$('mpin').value;
  if(!MP){$('err').textContent='اكتب رمز المدير';return}
  try{
    const r=await fetch(SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'trk_mgr',mpin:MP})});
    const j=await r.json();
    if(!j.ok){lockUI(errText(j));return}
    $('err').textContent='';$('mpin').value='';$('lock').style.display='none';
    const b=$('body');b.style.display='block';
    let h='<div class="bar"><h2>'+esc(j.center)+' — سير الدورة</h2><div><button class="b s" id="rf">🔄 تحديث</button><button class="b s" id="out">خروج</button></div></div>'
      +'<p class="note">آخر تحديث: '+new Date(j.at).toLocaleString('ar')+' — يتجدد تلقائياً كل دقيقتين.</p>';
    if(j.small){
      h+='<p class="small">عدد المتدربين المسجلين: <b>'+j.n+'</b>. لا تُعرض التوزيعات إلا إذا بلغ العدد 3 فأكثر، حفاظاً على خصوصية المتدربين.</p>';
    }else{
      h+='<div class="kpis">'+kpi(j.n,'متدرباً مسجلاً')+kpi(j.avg+'%','متوسط التقدم')+kpi(j.complete,'أتمّوا المسار')+kpi(j.stalled,'متوقفون ≥ '+j.stallDays+' أيام',1)+kpi(j.pendProj+j.pendVid,'بانتظار مراجعة المدرب',1)+'</div>';
      h+='<h3>الخطوات: كم متدرباً أتمّها؟</h3>'+j.steps.map(s=>{
        const p=j.n?Math.round(s.done/j.n*100):0;
        return '<div class="row"><div class="top"><span>'+esc(s.t)+'</span><span><b>'+s.done+'</b> من '+j.n+(s.wip?' — قيد الإنجاز: '+s.wip:'')+'</span></div><div class="track"><div class="fill" style="width:'+p+'%"></div></div></div>';
      }).join('');
      h+='<h3>توزيع التقدم</h3>'+j.dist.map(d=>{
        const p=j.n?Math.round(d.n/j.n*100):0;
        return '<div class="dist"><span>'+esc(d.l)+'</span><div class="track"><div class="fill" style="width:'+p+'%"></div></div><b>'+d.n+'</b></div>';
      }).join('');
    }
    b.innerHTML=h;
    $('rf').onclick=()=>load(false);
    $('out').onclick=()=>lockUI('');
    if(!timer)timer=setInterval(()=>{if(MP&&!document.hidden)load(false)},120000);
  }catch(x){
    if(first===false){$('err').textContent='';return}          /* انقطاع عابر أثناء التحديث التلقائي: أبقِ العرض كما هو */
    $('err').textContent='تعذّر الاتصال بالخادم.';
  }
}
$('go').onclick=()=>load();
$('mpin').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
</script>
</body>
</html>
